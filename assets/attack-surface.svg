<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 350" style="background:#0f0f1a">
  <!-- Traditional App -->
  <text x="400" y="35" text-anchor="middle" fill="#4ecca3" font-family="system-ui" font-size="14" font-weight="bold">Traditional App</text>
  <rect x="60" y="50" width="120" height="50" rx="8" fill="#1a1a2e" stroke="#5cb8e4" stroke-width="1.5"/>
  <text x="120" y="80" text-anchor="middle" fill="#e0e0e0" font-family="system-ui" font-size="12">User Input</text>
  <line x1="180" y1="75" x2="230" y2="75" stroke="#5cb8e4" stroke-width="2" marker-end="url(#arr1)"/>
  <rect x="230" y="50" width="120" height="50" rx="8" fill="#0a2a0a" stroke="#4ecca3" stroke-width="2"/>
  <text x="290" y="72" text-anchor="middle" fill="#4ecca3" font-family="system-ui" font-size="11" font-weight="bold">🔒 Validation</text>
  <text x="290" y="88" text-anchor="middle" fill="#888" font-family="system-ui" font-size="10">you control</text>
  <line x1="350" y1="75" x2="400" y2="75" stroke="#5cb8e4" stroke-width="2" marker-end="url(#arr1)"/>
  <rect x="400" y="50" width="120" height="50" rx="8" fill="#0a2a0a" stroke="#4ecca3" stroke-width="2"/>
  <text x="460" y="72" text-anchor="middle" fill="#4ecca3" font-family="system-ui" font-size="11" font-weight="bold">🔒 Your Code</text>
  <text x="460" y="88" text-anchor="middle" fill="#888" font-family="system-ui" font-size="10">deterministic</text>
  <line x1="520" y1="75" x2="570" y2="75" stroke="#5cb8e4" stroke-width="2" marker-end="url(#arr1)"/>
  <rect x="570" y="50" width="120" height="50" rx="8" fill="#1a1a2e" stroke="#5cb8e4" stroke-width="1.5"/>
  <text x="630" y="80" text-anchor="middle" fill="#e0e0e0" font-family="system-ui" font-size="12">Output</text>

  <!-- LLM App -->
  <text x="400" y="175" text-anchor="middle" fill="#e94560" font-family="system-ui" font-size="14" font-weight="bold">LLM App</text>
  <rect x="60" y="190" width="120" height="50" rx="8" fill="#1a1a2e" stroke="#5cb8e4" stroke-width="1.5"/>
  <text x="120" y="220" text-anchor="middle" fill="#e0e0e0" font-family="system-ui" font-size="12">User Input</text>
  <line x1="180" y1="215" x2="300" y2="215" stroke="#e94560" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arr2)"/>
  <rect x="300" y="185" width="180" height="60" rx="8" fill="#2a0a0a" stroke="#e94560" stroke-width="2"/>
  <text x="390" y="210" text-anchor="middle" fill="#e94560" font-family="system-ui" font-size="13" font-weight="bold">🧠 LLM</text>
  <text x="390" y="230" text-anchor="middle" fill="#888" font-family="system-ui" font-size="10">malleable by input!</text>
  <line x1="480" y1="215" x2="570" y2="215" stroke="#e94560" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arr2)"/>
  <rect x="570" y="190" width="120" height="50" rx="8" fill="#1a1a2e" stroke="#5cb8e4" stroke-width="1.5"/>
  <text x="630" y="220" text-anchor="middle" fill="#e0e0e0" font-family="system-ui" font-size="12">Output</text>

  <!-- Key insight -->
  <rect x="150" y="280" width="500" height="45" rx="8" fill="#16213e" stroke="#c4a7e7" stroke-width="1"/>
  <text x="400" y="307" text-anchor="middle" fill="#c4a7e7" font-family="system-ui" font-size="12">⚠️ Instructions and data share the same channel — no separation</text>

  <defs>
    <marker id="arr1" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#5cb8e4"/></marker>
    <marker id="arr2" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#e94560"/></marker>
  </defs>
</svg>
