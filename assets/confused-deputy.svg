<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" style="background:#0f0f1a">
  <!-- Attacker -->
  <rect x="40" y="100" width="160" height="80" rx="12" fill="#2a0a0a" stroke="#e94560" stroke-width="2"/>
  <text x="120" y="135" text-anchor="middle" fill="#e94560" font-family="system-ui" font-size="14" font-weight="bold">🎭 Attacker</text>
  <text x="120" y="160" text-anchor="middle" fill="#888" font-family="system-ui" font-size="12">(no permissions)</text>

  <!-- Arrow 1 -->
  <line x1="200" y1="140" x2="280" y2="140" stroke="#e94560" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="240" y="130" text-anchor="middle" fill="#888" font-family="system-ui" font-size="11">"just data"</text>

  <!-- LLM Agent -->
  <rect x="280" y="80" width="200" height="120" rx="12" fill="#1a1a2e" stroke="#5cb8e4" stroke-width="2"/>
  <text x="380" y="115" text-anchor="middle" fill="#5cb8e4" font-family="system-ui" font-size="14" font-weight="bold">🤖 LLM Agent</text>
  <text x="380" y="140" text-anchor="middle" fill="#888" font-family="system-ui" font-size="12">(has permissions)</text>
  <text x="380" y="165" text-anchor="middle" fill="#c4a7e7" font-family="system-ui" font-size="11">Can't distinguish</text>
  <text x="380" y="182" text-anchor="middle" fill="#c4a7e7" font-family="system-ui" font-size="11">instructions from data</text>

  <!-- Arrow 2 -->
  <line x1="480" y1="140" x2="560" y2="140" stroke="#e94560" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="520" y="130" text-anchor="middle" fill="#888" font-family="system-ui" font-size="11">executes</text>

  <!-- Damage -->
  <rect x="560" y="100" width="180" height="80" rx="12" fill="#2a0a0a" stroke="#e94560" stroke-width="2"/>
  <text x="650" y="135" text-anchor="middle" fill="#e94560" font-family="system-ui" font-size="14" font-weight="bold">💀 Damage</text>
  <text x="650" y="160" text-anchor="middle" fill="#888" font-family="system-ui" font-size="12">Data leak / Drop DB / Phish</text>

  <!-- Label -->
  <text x="400" y="260" text-anchor="middle" fill="#666" font-family="system-ui" font-size="13">The Confused Deputy Problem (Hardy, 1988)</text>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#e94560"/>
    </marker>
  </defs>
</svg>
