<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" style="background:#0f0f1a">
  <!-- Training objective -->
  <rect x="250" y="20" width="300" height="50" rx="10" fill="#0a2a0a" stroke="#4ecca3" stroke-width="2"/>
  <text x="400" y="50" text-anchor="middle" fill="#4ecca3" font-family="system-ui" font-size="14" font-weight="bold">🎯 Training: "Be Helpful" → Maximize</text>

  <!-- Arrow down -->
  <line x1="400" y1="70" x2="400" y2="100" stroke="#888" stroke-width="2" marker-end="url(#arrd)"/>

  <!-- Side effects box -->
  <rect x="100" y="100" width="600" height="160" rx="12" fill="#1a1a2e" stroke="#e94560" stroke-width="2"/>
  <text x="400" y="130" text-anchor="middle" fill="#e94560" font-family="system-ui" font-size="13" font-weight="bold">Side Effects of "Helpful"</text>

  <text x="160" y="165" fill="#e0e0e0" font-family="system-ui" font-size="12">💀 Leaks secrets</text>
  <text x="160" y="185" fill="#888" font-family="system-ui" font-size="10">→ sharing info is helpful!</text>

  <text x="160" y="215" fill="#e0e0e0" font-family="system-ui" font-size="12">💀 Follows injections</text>
  <text x="160" y="235" fill="#888" font-family="system-ui" font-size="10">→ being compliant is helpful!</text>

  <text x="450" y="165" fill="#e0e0e0" font-family="system-ui" font-size="12">💀 Fabricates citations</text>
  <text x="450" y="185" fill="#888" font-family="system-ui" font-size="10">→ being thorough is helpful!</text>

  <text x="450" y="215" fill="#e0e0e0" font-family="system-ui" font-size="12">💀 Drops tables</text>
  <text x="450" y="235" fill="#888" font-family="system-ui" font-size="10">→ being efficient is helpful!</text>

  <!-- Bottom insight -->
  <rect x="200" y="280" width="400" height="35" rx="8" fill="#2a0a0a" stroke="#e94560" stroke-width="1"/>
  <text x="400" y="302" text-anchor="middle" fill="#e94560" font-family="system-ui" font-size="12" font-weight="bold">Helpful AND Dangerous — by design</text>

  <defs>
    <marker id="arrd" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#888"/></marker>
  </defs>
</svg>
