<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380" font-family="monospace">
  <rect width="520" height="380" fill="#1e1e2e"/>

  <!-- What agent NEEDS -->
  <rect x="30" y="20" width="460" height="70" rx="8" fill="#313244" stroke="#a6e3a1" stroke-width="1.5"/>
  <text x="260" y="45" text-anchor="middle" fill="#a6e3a1" font-size="12" font-weight="bold">What the agent NEEDS:</text>
  <text x="260" y="70" text-anchor="middle" fill="#cdd6f4" font-size="11">📖 SELECT (read data)</text>

  <!-- What agent GOT -->
  <rect x="30" y="110" width="460" height="180" rx="8" fill="#313244" stroke="#f38ba8" stroke-width="1.5"/>
  <text x="260" y="135" text-anchor="middle" fill="#f38ba8" font-size="12" font-weight="bold">What the agent GOT:</text>
  <text x="260" y="160" text-anchor="middle" fill="#cdd6f4" font-size="11">📖 SELECT</text>
  <text x="260" y="180" text-anchor="middle" fill="#cdd6f4" font-size="11">✏️  INSERT, UPDATE</text>
  <text x="260" y="200" text-anchor="middle" fill="#f9e2af" font-size="11">🗑️  DELETE</text>
  <text x="260" y="220" text-anchor="middle" fill="#f38ba8" font-size="11">💀 DROP TABLE</text>
  <text x="260" y="240" text-anchor="middle" fill="#f38ba8" font-size="11">☠️  DROP DATABASE</text>
  <text x="260" y="260" text-anchor="middle" fill="#f38ba8" font-size="11" font-weight="bold">🔥 EXECUTE SHELL</text>

  <!-- Bottom insight -->
  <rect x="50" y="315" width="420" height="45" rx="8" fill="#313244" stroke="#cba6f7" stroke-width="1.5"/>
  <text x="260" y="337" text-anchor="middle" fill="#cba6f7" font-size="10">Don't give the intern the root password,</text>
  <text x="260" y="352" text-anchor="middle" fill="#cba6f7" font-size="10">even if the intern is very smart.</text>
</svg>
