<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" style="background:#0f0f1a">
  <!-- What agent NEEDS -->
  <rect x="60" y="30" width="300" height="120" rx="12" fill="#0a2a0a" stroke="#4ecca3" stroke-width="2"/>
  <text x="210" y="60" text-anchor="middle" fill="#4ecca3" font-family="system-ui" font-size="13" font-weight="bold">What the agent NEEDS</text>
  <text x="210" y="95" text-anchor="middle" fill="#e0e0e0" font-family="system-ui" font-size="16">📖 SELECT</text>
  <text x="210" y="125" text-anchor="middle" fill="#888" font-family="system-ui" font-size="11">(read data — that's it)</text>

  <!-- What agent GOT -->
  <rect x="440" y="10" width="300" height="270" rx="12" fill="#2a0a0a" stroke="#e94560" stroke-width="2"/>
  <text x="590" y="40" text-anchor="middle" fill="#e94560" font-family="system-ui" font-size="13" font-weight="bold">What the agent GOT</text>
  <text x="590" y="75" fill="#4ecca3" font-family="system-ui" font-size="13" text-anchor="middle">📖 SELECT</text>
  <text x="590" y="105" fill="#e0e0e0" font-family="system-ui" font-size="13" text-anchor="middle">✏️ INSERT, UPDATE</text>
  <text x="590" y="135" fill="#f59e0b" font-family="system-ui" font-size="13" text-anchor="middle">🗑️ DELETE</text>
  <text x="590" y="165" fill="#e94560" font-family="system-ui" font-size="13" text-anchor="middle">💀 DROP TABLE</text>
  <text x="590" y="195" fill="#e94560" font-family="system-ui" font-size="13" text-anchor="middle">☠️ DROP DATABASE</text>
  <text x="590" y="225" fill="#e94560" font-family="system-ui" font-size="13" text-anchor="middle">🔥 EXECUTE SHELL</text>
  <text x="590" y="255" fill="#e94560" font-family="system-ui" font-size="13" text-anchor="middle">☁️ TERMINATE EC2</text>
</svg>
